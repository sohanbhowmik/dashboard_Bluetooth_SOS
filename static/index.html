<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disaster Mesh Relief Coordination</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="topnav">
  <div class="brand">
    <div class="brand-text">MESH RELIEF</div>
    <div class="brand-sub">coordination dashboard</div>
  </div>
  <div class="ws-pill"><span id="ws-status" class="status-dot connecting"></span><span id="ws-text">Connecting</span></div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="headline">Active Requests <span class="badge" id="request-count">(0)</span></div>
      <ul class="filter-list" id="severity-filters">
        <li class="active" data-filter="ALL"><span>All Severities</span><span class="count" id="count-all">0</span></li>
        <li data-filter="CRITICAL"><span>Critical</span><span class="count" id="count-critical">0</span></li>
        <li data-filter="HIGH"><span>High</span><span class="count" id="count-high">0</span></li>
        <li data-filter="MEDIUM"><span>Medium</span><span class="count" id="count-medium">0</span></li>
        <li data-filter="LOW"><span>Low</span><span class="count" id="count-low">0</span></li>
      </ul>
    </div>
    <div id="request-list" class="request-list"></div>
  </aside>

  <div class="map-wrap">
    <div id="map"></div>
    <div class="map-vignette"></div>

    <div class="map-controls">
      <button class="map-btn" id="btn-zoom-in" title="Zoom in">+</button>
      <button class="map-btn" id="btn-zoom-out" title="Zoom out">–</button>
    </div>

    <div class="mesh-health">
      <div class="signal" id="mesh-signal">○</div>
      <div class="meta">Active nodes<br><b id="mesh-nodes">0</b> relaying · last sync <b id="mesh-sync">--</b></div>
    </div>

    <div class="detail-card" id="detail-card" style="display:none;">
      <div class="detail-top">
        <span class="detail-tag" id="detail-tag">CRITICAL</span>
        <div class="detail-title" id="detail-title">—</div>
        <div class="detail-sub" id="detail-sub">—</div>
      </div>
      <div class="detail-actions">
        <div class="detail-btn primary" id="detail-resolve">Mark Resolved</div>
        <div class="detail-btn ghost" id="detail-close">Close</div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/js/map.js" defer></script>
<script src="/js/app.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disaster Mesh — Relief Coordination</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="" />

    <!-- Custom CSS (NO /static/ prefix — mount root is static/) -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="app-header">
        <h1>Disaster Mesh Relief Coordination</h1>
        <div class="status-indicator">
            <span id="ws-status" class="status-dot connecting"></span>
            <span id="ws-text">Connecting...</span>
        </div>
    </header>

    <main class="dashboard-container">
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h2>Signal queue — <span id="request-count">0</span> active</h2>
            </div>
            <div id="request-list" class="request-list">
                <!-- Cards injected here via JS -->
            </div>
        </aside>

        <section id="map" class="map-container"></section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <script src="/js/map.js" defer></script>
    <script src="/js/app.js" defer></script>
</body>
</html>
